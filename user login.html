<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login System</title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);

            display: flex;
            justify-content: center;
            align-items: center;
        }


        .login-card {

            width: 100%;
            max-width: 430px;

            background: white;

            border-radius: 20px;

            padding: 35px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.2);

        }


        .login-icon {

            width: 70px;
            height: 70px;

            background: #667eea;

            color: white;

            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 30px;

            margin: 0 auto 15px;

        }


        .login-title {

            text-align: center;

            font-weight: bold;

            margin-bottom: 5px;

        }


        .login-subtitle {

            text-align: center;

            color: #6c757d;

            margin-bottom: 30px;

        }


        .form-label {

            font-weight: 600;

        }


        .form-control {

            border-radius: 10px;

            padding: 11px 14px;

        }


        .form-control:focus {

            box-shadow: 0 0 0 0.2rem
                rgba(102, 126, 234, 0.25);

        }


        .login-btn {

            width: 100%;

            padding: 11px;

            border-radius: 10px;

            font-weight: 600;

            background: #667eea;

            border: none;

        }


        .login-btn:hover {

            background: #5568d9;

        }


        #logout {

            width: 100%;

            padding: 11px;

            border-radius: 10px;

            font-weight: 600;

        }


        #heading {

            text-align: center;

            margin-bottom: 20px;

            font-weight: bold;

            color: #198754;

        }

    </style>

</head>


<body>


    <div class="login-card">


        <!-- Login Icon -->

        <div class="login-icon">

            🔐

        </div>


        <!-- Heading -->

        <h2 class="login-title">

            User Login

        </h2>


        <p class="login-subtitle">

            Enter your details to continue

        </p>


        <!-- Welcome Message -->

        <h2 id="heading"></h2>


        <!-- Login Form -->

        <form action="">


            <!-- Email -->

            <div class="mb-3">

                <label
                    for="email"
                    class="form-label">

                    Email Address

                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    placeholder="Enter your email">

            </div>


            <!-- Password -->

            <div class="mb-3">

                <label
                    for="password"
                    class="form-label">

                    Password

                </label>

                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    current-password="password"
                    placeholder="Enter your password">

            </div>


            <!-- Mobile -->

            <div class="mb-4">

                <label
                    for="mobilenum"
                    class="form-label">

                    Mobile Number

                </label>

                <input
                    type="mobilenum"
                    class="form-control"
                    id="mobilenum"
                    name="mobilenum"
                    placeholder="Enter your mobile number">

            </div>


            <!-- Submit -->

            <button
                type="button"
                class="btn btn-primary login-btn"
                onclick="passwordvalidation()">

                🔑 Login

            </button>


        </form>


        <!-- Logout -->

        <button
            id="logout"
            class="btn btn-danger mt-3"
            onclick="logoutbutton()">

            🚪 Logout

        </button>


    </div>



    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>



    <script>

        function Usernamevalidation(username) {

            var check = registeredUsers.find(function (user) {

                return user.name === username

            })

            if (check) {

                return "Search user exits"

            }

            else {

                console.log("username doesnot exits")

            }

        }


        var registeredUsers = [

            {
                id: 101,
                name: "Nisar",
                email: "nisar@gmail.com",
                password: "Nisar@123"
            },

            {
                id: 102,
                name: "Rahul",
                email: "rahul@gmail.com",
                password: "Rahul@123"
            },

            {
                id: 103,
                name: "Priya",
                email: "priya@gmail.com",
                password: "Priya@123"
            },

            {
                id: 104,
                name: "Arjun",
                email: "arjun@gmail.com",
                password: "Arjun@123"
            },

            {
                id: 105,
                name: "Sneha",
                email: "sneha@gmail.com",
                password: "Sneha@123"
            }

        ];


        console.log(Usernamevalidation('Arjun'))


        var failedlogincount = 0


        function passwordvalidation() {

            var emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


            var passwordPattern =
                /^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@#$!]).{8,}$/;


            var mobilepattern =
                /^\d{1,10}$/


            var mail =
                document.getElementById("email").value


            var pw =
                document.getElementById("password").value


            var mobile =
                document.getElementById("mobilenum").value


            if (failedlogincount >= 3) {

                alert("Your account is locked!!")

                return

            }


            if (!emailPattern.test(mail)) {

                console.log("Invalid email");

                failedlogincount += 1

                return;

            }


            if (!passwordPattern.test(pw)) {

                console.log("Invalid password");

                failedlogincount += 1

                console.log(failedlogincount);

                return;

            }


            if (!mobilepattern.test(mobile)) {

                console.log("Invalid mobile number");

                return;

            }


            var check = registeredUsers.find(function (user) {

                return user.email === mail

            })


            if (check) {

                console.log(
                    "user exits :",
                    check.id,
                    check.name
                )


                if (check.password === pw) {

                    console.log(
                        "successfull Login!!!"
                    );


                    document
                        .querySelector("form")
                        .style.display = "none";


                    document
                        .querySelector("h2")
                        .innerHTML =
                        "welcome to " +
                        document.getElementById("email").value;


                    document
                        .querySelector("#logout")
                        .style.display = "block"

                }

                else {

                    console.log(
                        "Wrong Password!!!"
                    );

                }

            }

            else {

                console.log(
                    "User Not found!!!"
                )

                failedlogincount += 1

                console.log(failedlogincount);

                return

            }

        }


        function logoutbutton() {

            document
                .querySelector("h2")
                .style.display = "none";


            document
                .querySelector("form")
                .style.display = "block";


            document
                .querySelector("form")
                .reset()


            document
                .querySelector("#logout")
                .style.display = "none"

        }


    </script>


</body>

</html>
